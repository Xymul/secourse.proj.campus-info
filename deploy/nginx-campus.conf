# ============================================================
#  此刻校园 · Nginx 站点配置（Debian 13）
#
#  作用：托管前端静态产物（frontend/dist），并把 /api 反向代理到后端 8080。
#
#  安装：
#    sudo apt install nginx
#    sudo cp -r frontend/dist /opt/campus/frontend/dist
#    sudo cp deploy/nginx-campus.conf /etc/nginx/sites-available/campus
#    sudo ln -sf /etc/nginx/sites-available/campus /etc/nginx/sites-enabled/campus
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    charset utf-8;
    client_max_body_size 8m;

    root /opt/campus/frontend/dist;
    index index.html;

    # 前端为 Vue Router Hash 模式，静态资源直接返回；其余回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
