# 集成测试环境：H2 内存库（PostgreSQL 兼容模式），结构与实体自动对齐
spring.datasource.url=jdbc:h2:mem:campus_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 测试只生成少量模拟数据，保证用例执行速度
campus.seed.enabled=true
campus.seed.mock-post-count=120
campus.auth.token-ttl-hours=2
campus.search.default-radius-km=3.0
campus.governance.false-verify-warn-threshold=3
campus.governance.report-auto-audit-threshold=2
campus.governance.pre-audit=false
